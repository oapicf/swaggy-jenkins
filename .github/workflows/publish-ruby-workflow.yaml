name: Publish Ruby
'on':
  push:
    tags:
      - '*'
permissions:
  contents: read
  id-token: write
jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          set-safe-directory: ${{ github.workspace }}
      - uses: rubygems/configure-rubygems-credentials@v2.1.0
      - uses: iamsauravsharma/create-dotenv@v4.0.0
        with:
          input-prefix: 'GITHUB_'
          output-prefix: 'GITHUB_'
          file-path: '/tmp/.env'
      - uses: cliffano/command-docker-action@v2.1.0
        with:
          image: cliffano/studio:4.0.0
          command: |
            make clean deps init-spec generate-primary build-ruby test-ruby &&
            make publish-ruby
          env_file: '/tmp/.env'
          extra_args: '--env GEM_HOST_API_KEY'
