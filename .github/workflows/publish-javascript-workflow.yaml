name: Publish JavaScript
'on':
  push:
    tags:
      - '*'
permissions:
  contents: read
  id-token: write
jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          set-safe-directory: ${{ github.workspace }}
      - uses: iamsauravsharma/create-dotenv@v4.0.0
        with:
          input-prefix: 'GITHUB_'
          output-prefix: 'GITHUB_'
          file-path: '/tmp/.env'
      - uses: cliffano/command-docker-action@v2.1.0
        with:
          image: cliffano/studio:4.0.0
          command: |
            make clean deps init-spec generate-primary build-javascript test-javascript &&
            make --environment-overrides publish-javascript
          env_file: '/tmp/.env'
          extra_args: '--env ACTIONS_ID_TOKEN_REQUEST_URL --env ACTIONS_ID_TOKEN_REQUEST_TOKEN --env RUNNER_ENVIRONMENT'
